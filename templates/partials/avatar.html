{% load ui %}{% if u.avatar %}<img src="{{ u.avatar.url }}" alt="" class="inline-block rounded-full object-cover align-middle" style="width:{{ size|default:32 }}px;height:{{ size|default:32 }}px">{% else %}<span class="inline-flex items-center justify-center rounded-full bg-primary-100 font-semibold text-primary-700 align-middle dark:bg-primary-900 dark:text-primary-200" style="width:{{ size|default:32 }}px;height:{{ size|default:32 }}px;font-size:{% widthratio size|default:32 100 38 %}px">{{ u.initials }}</span>{% endif %}
