<section class="mx-auto max-w-3xl">
  <h2 class="mb-6 text-center text-3xl font-bold tracking-tight">{{ block.title|default:"Ko'p so'raladigan savollar" }}</h2>
  <div class="space-y-3">
    {% for item in block.items.all %}
    <details class="card group p-4 open:shadow-md">
      <summary class="flex cursor-pointer list-none items-center justify-between font-semibold">{{ item.title }}<span class="text-xl transition group-open:rotate-45">+</span></summary>
      <p class="mt-3 text-sm muted">{{ item.text }}</p>
    </details>
    {% endfor %}
  </div>
</section>
